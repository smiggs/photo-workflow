[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "photo-workflow"
version = "0.1.0"
description = "Read-only raw inventory and coordinate validation for a photo workflow."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "opencv-python==5.0.0.93",
    "pydantic==2.14.1",
    "rawpy==0.27.1",
    "scikit-image==0.26.0",
]

[project.scripts]
photo-pipeline = "photo_workflow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "validate-pyproject==0.26",
]
test = [
    "hypothesis==6.170.1",
    "pytest==9.1.1",
    "tifffile==2026.10.15",
]
